[workspace]
members = ["crates/packet-core"]
exclude = [
    "benchmarks/parser/library-spike",
    "benchmarks/wasm/toolchain-spike",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/khvedela/wirelens"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
