[package]
name = "wirelens-wasm-toolchain-spike"
version = "0.0.0"
edition = "2024"
description = "Disposable WireLens Rust/Wasm module-worker toolchain probe"
license = "MIT"
repository = "https://github.com/khvedela/wirelens"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# This disposable probe is intentionally independent from the product workspace.
[workspace]
