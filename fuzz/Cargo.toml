[package]
name = "wirelens-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
packet-core = { path = "../crates/packet-core" }
protocol-decoders = { path = "../crates/protocol-decoders" }

[[bin]]
name = "capture_import"
path = "fuzz_targets/capture_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_decode"
path = "fuzz_targets/network_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
