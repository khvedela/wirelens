name: Toolchain spike

on:
  pull_request:
    paths:
      - ".github/workflows/toolchain-spike.yml"
      - ".node-version"
      - ".nvmrc"
      - "rust-toolchain.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "apps/web/**"
      - "benchmarks/browser-ingestion/**"
      - "benchmarks/wasm/boundary-harness/**"
      - "benchmarks/wasm/toolchain-spike/**"
      - "fixtures/manifests/**"
      - "fuzz/**"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    name: Rust/Wasm boundary and module-worker probes
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned Rust and Wasm target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.97.1

      - name: Verify pinned Rust root workspace and MSRV
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo check --locked --workspace --target wasm32-unknown-unknown --all-features
          cargo clippy --locked --workspace --target wasm32-unknown-unknown --all-features -- -D warnings
          RUSTUP_TOOLCHAIN=1.85.0 cargo check --locked --workspace --all-targets --all-features

      - name: Install locked toolchain-spike dependencies
        working-directory: benchmarks/wasm/toolchain-spike
        run: corepack pnpm install --frozen-lockfile

      - name: Install locked boundary-harness dependencies
        working-directory: benchmarks/wasm/boundary-harness
        run: corepack pnpm install --frozen-lockfile

      - name: Install locked product-web dependencies
        working-directory: apps/web
        run: corepack pnpm install --frozen-lockfile

      - name: Install shared exact Wasm tools
        working-directory: benchmarks/wasm/boundary-harness
        run: corepack pnpm run tools:install

      - name: Install exact browser engines and system dependencies
        working-directory: benchmarks/wasm/boundary-harness
        run: corepack pnpm exec playwright install --with-deps chromium firefox

      - name: Verify existing toolchain-spike module-worker flows
        working-directory: benchmarks/wasm/toolchain-spike
        run: corepack pnpm run verify:all

      - name: Verify direct boundary build and record Chromium evidence
        working-directory: benchmarks/wasm/boundary-harness
        run: |
          corepack pnpm run evidence
          test -s test-results/boundary-evidence.md
          cat test-results/boundary-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify boundary browser suite in Chromium and Firefox
        working-directory: benchmarks/wasm/boundary-harness
        run: corepack pnpm run test:browser

      - name: Verify browser-ingestion fixtures, privacy boundary, and production build
        working-directory: apps/web
        run: |
          corepack pnpm run format:check
          corepack pnpm run lint
          corepack pnpm run test:fixtures
          corepack pnpm run typecheck
          corepack pnpm run verify:privacy
          corepack pnpm run evidence:check
          corepack pnpm run build:web

      - name: Verify product importer in Chromium and Firefox
        working-directory: apps/web
        run: corepack pnpm run test:browser

      - name: Record qualifying full-Chromium browser-ingestion evidence
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/web
        env:
          WIRELENS_INGESTION_EVIDENCE_MIB: 240
        run: |
          corepack pnpm run test:browser:evidence
          test -s test-results/browser-ingestion-evidence.json
          node scripts/evidence.mjs --render-only --output test-results/browser-ingestion-evidence.md
          test -s test-results/browser-ingestion-evidence.md
          cat test-results/browser-ingestion-evidence.md >> "$GITHUB_STEP_SUMMARY"

  fuzz-corpus-replay:
    if: github.event_name == 'pull_request'
    name: Replay bounded synthetic importer corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FUZZ_NIGHTLY: nightly-2026-07-20
      CARGO_FUZZ_VERSION: 0.13.2

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Replay each committed synthetic seed once
        run: |
          for seed in fuzz/corpus/capture_import/*; do
            test -f "$seed"
            cargo +"$FUZZ_NIGHTLY" fuzz run capture_import "$seed" -- -runs=1 -timeout=2 -rss_limit_mb=1024
          done

  fuzz-scheduled-campaign:
    if: github.event_name == 'schedule'
    name: Run scheduled capture importer fuzz campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FUZZ_NIGHTLY: nightly-2026-07-20
      CARGO_FUZZ_VERSION: 0.13.2

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Run bounded scheduled campaign
        run: |
          cargo +"$FUZZ_NIGHTLY" fuzz run capture_import fuzz/corpus/capture_import -- \
            -max_total_time=600 \
            -max_len=4096 \
            -timeout=2 \
            -rss_limit_mb=1024 \
            -print_final_stats=1
